<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page and page.title and not page.is_homepage %}{{ page.title }} · {% endif %}{{ config.site_name }}</title>
  {% if config.site_description %}<meta name="description" content="{{ config.site_description }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ 'css/style.css' | url }}">
</head>
<body>
  <main class="container">
    <header>
      <a class="site-name" href="{{ nav.homepage.url | url }}">{{ config.site_name }}</a>
    </header>
    <article>
      {{ page.content }}
    </article>
  </main>
</body>
</html>
